<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Luis Guinea music catalogue, production credits and artwork."><link rel="canonical" href="https://luisguinea.com/music/"><title>Music / Audio — Luis Guinea</title><link rel="stylesheet" href="../css/styles.css"></head>
<body><a class="skip-link" href="#catalog" data-i18n="ui.skip"></a><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../index.html">LUIS GUINEA<span> / MUSIC</span></a><nav class="nav" aria-label="Primary"><a href="../index.html#writing" data-i18n="nav.writing"></a><a href="../index.html#experience" data-i18n="nav.experience"></a><a href="../cv.html" data-i18n="nav.cv"></a><a href="../index.html#contact" data-i18n="nav.contact"></a></nav><div class="tools"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="es" aria-pressed="false">ES</button><button data-theme-choice="dark" data-i18n="ui.dark"></button></div></div></header>
<main><section class="music-hero wrap"><div><p class="eyebrow" data-i18n="music.label"></p><h1 data-i18n="music.title"></h1><p class="intro" data-i18n="music.intro"></p></div><img src="../assets/images/cover.webp" alt="Music catalogue cover"></section>
<section class="music-catalog section"><div class="wrap"><div class="catalog-intro"><div class="notice"><strong data-i18n="music.top"></strong><br><span data-i18n="music.topNote"></span></div><p class="catalog-count"><span id="count">0</span> releases / documented catalogue</p></div><div class="music-toolbar"><label class="sr-only" for="search" data-i18n="music.search"></label><input id="search" type="search" data-i18n-placeholder="music.search"><label class="sr-only" for="role">Role</label><select id="role" aria-label="Filter by role"><option value="" data-i18n="music.all"></option><option value="Artist" data-i18n="music.artist"></option><option value="Producer" data-i18n="music.producer"></option><option value="Composer" data-i18n="music.composer"></option></select></div><div id="catalog" class="catalog editorial-catalog" aria-live="polite"></div></div></section></main><footer class="footer"><div class="wrap"><a href="../index.html" data-i18n="music.back"></a></div></footer>
<script src="../js/strings.js"></script><script src="../js/i18n.js"></script><script src="../js/music-data.js"></script><script src="../js/site.js"></script><script>
const catalog=document.querySelector('#catalog'),search=document.querySelector('#search'),role=document.querySelector('#role'),count=document.querySelector('#count');
function norm(value){return String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function previewUrl(name){return /^[a-z0-9][a-z0-9-]*\.mp3$/.test(String(name||''))?'../assets/audio/previews/'+encodeURIComponent(name):''}
function render(){const q=norm(search.value);const items=MUSIC_DATA.filter(x=>(!q||norm([x.title,x.artist,x.role,x.roles.join(' '),x.releaseType,x.year].join(' ')).includes(q))&&(!role.value||x.role===role.value));count.textContent=items.length;catalog.innerHTML=items.length?items.map((x,i)=>`<article class="track editorial-track"><div class="track-art"><img loading="lazy" src="../assets/images/${encodeURIComponent(x.artwork)}" alt="Artwork: ${x.title}"><span class="track-number">${String(i+1).padStart(2,'0')}</span></div><div class="track-info"><p class="track-kicker">${x.releaseType} / ${x.year} / ${x.roles.join(', ')}</p><h2 class="track-title">${x.title}</h2><p class="track-artist">${x.artist}</p><div class="track-details"><span>Credit: ${x.roles.join(', ')}</span>${x.preview&&previewUrl(x.preview)?`<audio class="track-preview" controls preload="none" src="${previewUrl(x.preview)}" aria-label="Preview: ${x.title}"></audio>`:`<span class="preview-status"><i></i><span data-i18n="music.noPreview">${t('music.noPreview')}</span></span>`}</div></div></article>`).join(''):`<p class="empty-state">${t('music.noResults')}</p>`}
search.addEventListener('input',render);role.addEventListener('change',render);document.addEventListener('DOMContentLoaded',render);</script></body></html>
