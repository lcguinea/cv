<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Luis Guinea music catalogue and credits."><link rel="canonical" href="https://luisguinea.com/music/"><title>Music | Luis Guinea</title><link rel="stylesheet" href="../css/styles.css"></head><body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="../">LUIS GUINEA</a><nav class="nav"><a href="../#writing" data-i18n="nav.writing"></a><a href="../cv.html" data-i18n="nav.cv"></a><a href="../#contact" data-i18n="nav.contact"></a></nav><div class="tools"><button data-lang="en">EN</button><button data-lang="es">ES</button></div></div></header><main><section class="hero wrap"><p class="eyebrow" data-i18n="music.label"></p><h1 data-i18n="music.title"></h1><p class="intro" data-i18n="music.intro"></p></section><section class="section"><div class="wrap"><div class="notice"><strong data-i18n="music.top"></strong><br><span data-i18n="music.topNote"></span></div><div class="music-toolbar"><label class="sr-only" for="search" data-i18n="music.search"></label><input id="search" type="search" data-i18n-placeholder="music.search"><select id="role" aria-label="Filter"><option value="" data-i18n="music.all"></option><option>Artist</option><option>Producer</option></select></div><div id="catalog" class="catalog" aria-live="polite"></div></div></section></main><footer class="footer"><div class="wrap"><a href="../" data-i18n="music.back"></a></div></footer><script src="../js/strings.js"></script><script src="../js/i18n.js"></script><script src="../js/music-data.js"></script><script>const catalog=document.querySelector('#catalog'),search=document.querySelector('#search'),role=document.querySelector('#role');function render(){const q=search.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const items=MUSIC_DATA.filter(x=>(!q||[x.title,x.artist,x.role].join(' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q))&&(!role.value||x.role===role.value));catalog.innerHTML=items.length?items.map(x=>`<article class="track"><img loading="lazy" src="../assets/images/${encodeURIComponent(x.artwork)}" alt="Artwork: ${x.title}"><div class="track-title">${x.title}</div><div class="track-meta">${x.artist} · ${x.role} · ${x.releaseType}</div><p class="track-meta">${t('music.noPreview')}</p></article>`).join(''):`<p>${t('music.noResults')}</p>`}search.addEventListener('input',render);role.addEventListener('change',render);document.addEventListener('DOMContentLoaded',render);</script></body></html>
